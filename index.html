<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>In the 掘～る</title>

    <style>
        /* =========================
           全体
        ========================= */

        body {
            margin: 0;
            font-family: sans-serif;
            background:
                radial-gradient(circle at 20% 20%, #8b5a2b 0 8%, transparent 9%),
                radial-gradient(circle at 80% 70%, #6b4423 0 10%, transparent 11%),
                linear-gradient(#5b3a29, #3b271c);
            color: #fff;
            min-height: 100vh;
        }

        /* =========================
           ヘッダー
        ========================= */

        header {
            text-align: center;
            padding: 35px 20px 25px;
            background: rgba(0, 0, 0, 0.25);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            color: #ffd966;
            text-shadow: 3px 3px 0 #4a2c18;
        }

        header p {
            margin-top: 10px;
            font-size: 1.1rem;
        }

        /* =========================
           タブ
        ========================= */

        .tabs {
            display: flex;
            justify-content: center;
            gap: 5px;
            background: #2c1b12;
            padding: 10px;
        }

        .tab-button {
            border: none;
            background: #5c4030;
            color: white;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: 0.2s;
        }

        .tab-button:hover {
            background: #79543a;
        }

        /* 選択中のタブ */
        .tab-button.active {
            background: #d9a441;
            color: #3b271c;
        }

        /* =========================
           メイン
        ========================= */

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px 50px;
        }

        /* =========================
           各ページ
        ========================= */

        .tab-content {
            display: none;
            background: rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
        }

        /* 表示するページ */
        .tab-content.active {
            display: block;
        }

        h2 {
            text-align: center;
            color: #ffd966;
            margin-top: 0;
            font-size: 2rem;
        }

        h3 {
            color: #ffd966;
            border-left: 5px solid #d9a441;
            padding-left: 10px;
        }

        /* =========================
           動画
        ========================= */

        .video-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #24170f;
            border: 3px dashed #c49a5a;
            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 20px 0;
            color: #c9b59a;
        }

        /* =========================
           ランキング
        ========================= */

        .ranking {
            max-width: 600px;
            margin: 0 auto;
        }

        .rank {
            display: flex;
            justify-content: space-between;
            align-items: center;

            background: rgba(0, 0, 0, 0.25);
            padding: 15px 20px;
            margin: 12px 0;

            border-radius: 10px;
            font-size: 1.2rem;
        }

        .rank-number {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .score {
            font-weight: bold;
            color: #ffd966;
        }

        /* =========================
           待ち状況
        ========================= */

        .waiting-box {
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .waiting-label {
            font-size: 1rem;
            margin-top: 20px;
        }

        .waiting-number {
            font-size: 4rem;
            font-weight: bold;
            color: #ffd966;
            margin: 10px 0 30px;
        }

        .next-number {
            font-size: 2rem;
            font-weight: bold;
        }

        /* =========================
           スマホ対応
        ========================= */

        @media (max-width: 600px) {

            header h1 {
                font-size: 2rem;
            }

            .tabs {
                gap: 2px;
            }

            .tab-button {
                padding: 10px 12px;
                font-size: 0.85rem;
            }

            .tab-content {
                padding: 20px 15px;
            }

            .waiting-number {
                font-size: 3rem;
            }
        }
    </style>
</head>


<body>

    <!-- =========================
         ヘッダー
    ========================= -->

    <header>
        <h1>⛏️ In the 掘～る 💎</h1>
        <p>掘って、掘って、宝を見つけよう！</p>
    </header>


    <!-- =========================
         タブ
    ========================= -->

    <nav class="tabs">

        <button class="tab-button active" onclick="showTab('top', this)">
            TOP
        </button>

        <button class="tab-button" onclick="showTab('ranking', this)">
            Ranking
        </button>

        <button class="tab-button" onclick="showTab('waiting', this)">
            Waiting list
        </button>

    </nav>


    <!-- =========================
         メイン
    ========================= -->

    <main>


        <!-- =========================
             TOP
        ========================= -->

        <section id="top" class="tab-content active">

            <h2>⛏️ In the 掘～る</h2>

            <h3>ゲーム紹介</h3>

            <p>
                「In the 掘～る」は、土を掘って宝を探すゲームです。
            </p>

            <p>
                どんな宝が見つかるかは掘ってみてのお楽しみ！
            </p>


            <h3>プレイ動画</h3>

            <div class="video-box">
                <p>🎥 プレイ動画準備中</p>
            </div>

        </section>



        <!-- =========================
             Ranking
        ========================= -->

        <section id="ranking" class="tab-content">

            <h2>🏆 Ranking</h2>

            <div class="ranking">

                <div class="rank">
                    <span class="rank-number">🥇 1位</span>
                    <span class="score">980点</span>
                </div>

                <div class="rank">
                    <span class="rank-number">🥈 2位</span>
                    <span class="score">850点</span>
                </div>

                <div class="rank">
                    <span class="rank-number">🥉 3位</span>
                    <span class="score">720点</span>
                </div>

            </div>

        </section>



        <!-- =========================
             Waiting list
        ========================= -->

        <section id="waiting" class="tab-content">

            <h2>🎫 Waiting list</h2>

            <div class="waiting-box">

                <div class="waiting-label">
                    現在のご案内
                </div>

                <div class="waiting-number">
                    No. 7
                </div>


                <div class="waiting-label">
                    次のご案内
                </div>

                <div class="next-number">
                    No. 8
                </div>

            </div>

        </section>


    </main>



    <!-- =========================
         JavaScript
    ========================= -->

    <script>

        function showTab(tabId, button) {

            // すべてのページを非表示にする
            const contents = document.querySelectorAll('.tab-content');

            contents.forEach(function(content) {
                content.classList.remove('active');
            });


            // 選択されたページを表示する
            const selectedTab = document.getElementById(tabId);

            selectedTab.classList.add('active');


            // すべてのタブから active を削除
            const buttons = document.querySelectorAll('.tab-button');

            buttons.forEach(function(btn) {
                btn.classList.remove('active');
            });


            // 押されたタブを active にする
            button.classList.add('active');
        }

    </script>

</body>
</html>
